name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      - name: Check documentation and committed results
        run: npm run check

      - name: Install parity browser
        run: npx playwright install --with-deps chromium

      - name: Test equivalent behavior
        run: npm test

      - name: Reproduce hand-authored application
        run: npm run benchmark:hand-authored

      - name: Verify normalized measurements
        run: npm run verify

      - name: Rebuild charts
        run: npm run charts

      - name: Verify deterministic charts
        run: git diff --exit-code -- docs/images
