name: Reproduce complete benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      - name: Check documentation
        run: npm run check:docs

      - name: Rebuild all five result sets
        run: npm run benchmark:all

      - name: Verify normalized result hashes
        run: npm run verify

      - name: Rebuild charts
        run: npm run charts

      - name: Verify deterministic charts
        run: git diff --exit-code -- docs/images

      - name: Upload regenerated reports
        uses: actions/upload-artifact@v4
        with:
          name: vue-svelte-benchmark-results
          path: |
            *.json
            *.md
            docs/images/*.svg
          if-no-files-found: error
