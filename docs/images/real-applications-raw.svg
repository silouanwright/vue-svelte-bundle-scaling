<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" role="img" aria-labelledby="title description">
  <title id="title">Production output before compression (kB)</title>
  <desc id="description">Before transfer compression, Svelte emits less production output for the Weather Front and terminal applications. Vue emits less after the OpenSlides dashboard route loads and extends its lead after the editor route loads. One continuous curve passes through the four measured uncompressed production states for each framework.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17202a; }
    .title { font-size: 23px; font-weight: 700; }
    .subtitle { font-size: 13px; fill: #4a5560; }
    .axis { stroke: #44515e; stroke-width: 1.5; }
    .grid { stroke: #dce2e7; stroke-width: 1; }
    .tick { font-size: 12px; }
    .label { font-size: 14px; font-weight: 650; }
    .detail { font-size: 12px; fill: #4a5560; }
    .value { font-size: 12px; font-weight: 700; }
    .legend { font-size: 14px; font-weight: 650; }
    .crossover { font-size: 12px; font-weight: 700; fill: #4a5560; }
  </style>
  <rect width="880" height="500" fill="#ffffff" />
  <text x="42" y="38" class="title">Production output before compression (kB)</text>
  <text x="42" y="61" class="subtitle">Vue versus Svelte · cumulative uncompressed production bytes · four measured states</text>
  <line x1="672" y1="30" x2="708" y2="30" stroke="#238a62" stroke-width="4" />
  <circle cx="690" cy="30" r="5" fill="#238a62" />
  <text x="718" y="35" class="legend">Vue</text>
  <line x1="770" y1="30" x2="806" y2="30" stroke="#d93600" stroke-width="4" />
  <rect x="783" y="25" width="10" height="10" rx="1" fill="#d93600" transform="rotate(45 788 30)" />
  <text x="816" y="35" class="legend">Svelte</text>

  <line x1="92" y1="390" x2="830" y2="390" class="grid" />
  <text x="78" y="395" text-anchor="end" class="tick">0 kB</text>
  <line x1="92" y1="346.86" x2="830" y2="346.86" class="grid" />
  <text x="78" y="351.86" text-anchor="end" class="tick">500 kB</text>
  <line x1="92" y1="303.71" x2="830" y2="303.71" class="grid" />
  <text x="78" y="308.71" text-anchor="end" class="tick">1,000 kB</text>
  <line x1="92" y1="260.57" x2="830" y2="260.57" class="grid" />
  <text x="78" y="265.57" text-anchor="end" class="tick">1,500 kB</text>
  <line x1="92" y1="217.43" x2="830" y2="217.43" class="grid" />
  <text x="78" y="222.43" text-anchor="end" class="tick">2,000 kB</text>
  <line x1="92" y1="174.29" x2="830" y2="174.29" class="grid" />
  <text x="78" y="179.29" text-anchor="end" class="tick">2,500 kB</text>
  <line x1="92" y1="131.14" x2="830" y2="131.14" class="grid" />
  <text x="78" y="136.14" text-anchor="end" class="tick">3,000 kB</text>
  <line x1="92" y1="88" x2="92" y2="390" class="axis" />
  <line x1="92" y1="390" x2="830" y2="390" class="axis" />
  <line x1="342.4967909790716" y1="88" x2="342.4967909790716" y2="390" stroke="#7b8794" stroke-width="1.5" stroke-dasharray="5 5" />
  <text x="352.4967909790716" y="105" class="crossover">Approx. crossover</text>
  <text x="352.4967909790716" y="122" class="detail">Vue becomes smaller</text>

  <path d="M 138 384.19 C 169.33 379.77, 261.33 378.22, 326 357.66 C 390.67 337.10, 455.67 281.45, 526 260.82 C 596.33 240.19, 711.00 238.34, 748 233.85" fill="none" stroke="#238a62" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="138" cy="384.19" r="6" fill="#238a62" /><circle cx="326" cy="357.66" r="6" fill="#238a62" /><circle cx="526" cy="260.82" r="6" fill="#238a62" /><circle cx="748" cy="233.85" r="6" fill="#238a62" />
  <path d="M 138 386.05 C 169.33 381.63, 261.33 386.94, 326 359.55 C 390.67 332.16, 455.67 262.86, 526 221.68 C 596.33 180.50, 711.00 130.70, 748 112.5" fill="none" stroke="#d93600" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="133" y="381.05" width="10" height="10" rx="1" fill="#d93600" transform="rotate(45 138 386.05)" /><rect x="321" y="354.55" width="10" height="10" rx="1" fill="#d93600" transform="rotate(45 326 359.55)" /><rect x="521" y="216.68" width="10" height="10" rx="1" fill="#d93600" transform="rotate(45 526 221.68)" /><rect x="743" y="107.5" width="10" height="10" rx="1" fill="#d93600" transform="rotate(45 748 112.5)" />
  <text x="128" y="372.05" text-anchor="end" class="value">45 kB</text>
  <text x="148" y="398.19" class="value">67 kB</text>
  <text x="316" y="347.55" text-anchor="end" class="value">352 kB</text>
  <text x="316" y="375.66" text-anchor="end" class="value">374 kB</text>
  <text x="516" y="209.68" text-anchor="end" class="value">1,950 kB</text>
  <text x="536" y="282.82" class="value">1,497 kB</text>
  <text x="738" y="100.5" text-anchor="end" class="value">3,216 kB</text>
  <text x="758" y="255.85" class="value">1,809 kB</text>

  <text x="138" y="417" text-anchor="middle" class="label">Small app</text>
  <text x="138" y="437" text-anchor="middle" class="detail">Weather Front</text>
  <text x="138" y="455" text-anchor="middle" class="detail">Entire app</text>
  <text x="326" y="417" text-anchor="middle" class="label">Small app</text>
  <text x="326" y="437" text-anchor="middle" class="detail">Terminal</text>
  <text x="326" y="455" text-anchor="middle" class="detail">Entire app</text>
  <text x="526" y="417" text-anchor="middle" class="label">Medium-size app</text>
  <text x="526" y="437" text-anchor="middle" class="detail">OpenSlides · one route</text>
  <text x="526" y="455" text-anchor="middle" class="detail">Dashboard</text>
  <text x="748" y="417" text-anchor="middle" class="label">Medium-size app</text>
  <text x="748" y="437" text-anchor="middle" class="detail">OpenSlides · two routes</text>
  <text x="748" y="455" text-anchor="middle" class="detail">Dashboard + editor</text>
