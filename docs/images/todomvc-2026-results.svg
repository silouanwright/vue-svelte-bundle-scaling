  <line x1="520" y1="144" x2="520" y2="380" class="axis" />
  <line x1="520" y1="380" x2="830" y2="380" class="axis" />

    <rect x="560.5" y="195.57" width="34" height="184.43" rx="3" fill="#238a62" />
