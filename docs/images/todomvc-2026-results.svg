  <line x1="76" y1="380" x2="426" y2="380" class="axis" />

    <rect x="101" y="230.45" width="30.333333333333336" height="149.55" rx="3" fill="#238a62" />
    <text x="116.16666666666667" y="222.45" text-anchor="middle" class="value">3.8 kB</text>
    <rect x="137.33333333333334" y="174.96" width="30.333333333333336" height="205.04" rx="3" fill="#d93600" />
    <text x="152.5" y="166.96" text-anchor="middle" class="value">5.2 kB</text>
    <text x="134.33333333333334" y="403" text-anchor="middle" class="category">Minified</text>
    <rect x="217.66666666666666" y="321.63" width="30.333333333333336" height="58.370000000000005" rx="3" fill="#238a62" />
