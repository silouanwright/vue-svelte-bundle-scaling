    <text x="269.1666666666667" y="302.69" text-anchor="middle" class="value">1.76 kB</text>
    <text x="251" y="403" text-anchor="middle" class="category">Gzip</text>
    <rect x="334.33333333333337" y="328.63" width="30.333333333333336" height="51.370000000000005" rx="3" fill="#238a62" />
    <text x="349.50000000000006" y="320.63" text-anchor="middle" class="value">1.31 kB</text>
    <rect x="370.6666666666667" y="321" width="30.333333333333336" height="59" rx="3" fill="#d93600" />
    <text x="385.83333333333337" y="313" text-anchor="middle" class="value">1.50 kB</text>
    <text x="367.6666666666667" y="403" text-anchor="middle" class="category">Brotli</text>

  <text x="520" y="96" class="panel-title">Tiny one-component application</text>
  <text x="520" y="117" class="panel-note">Framework runtime included · Brotli</text>

