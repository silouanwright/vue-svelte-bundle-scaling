<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" role="img" aria-labelledby="title description">
  <title id="title">TodoMVC in 2026: the bundle-size tradeoff remains</title>
  <desc id="description">Vue emits less component-specific code than Svelte in the current TodoMVC specimen. Svelte's complete one-component CSR and hydration bundles remain smaller because its shared framework baseline is smaller.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17202a; }
    .title { font-size: 23px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #4a5560; }
    .panel-title { font-size: 16px; font-weight: 700; }
    .panel-note { font-size: 12px; fill: #4a5560; }
    .axis { stroke: #44515e; stroke-width: 1.5; }
    .grid { stroke: #dce2e7; stroke-width: 1; }
    .tick { font-size: 12px; }
    .category { font-size: 13px; font-weight: 600; }
    .value { font-size: 11px; font-weight: 650; }
    .legend { font-size: 14px; font-weight: 650; }
  </style>
  <rect width="880" height="500" fill="#ffffff" />
  <text x="42" y="38" class="title">TodoMVC in 2026: the tradeoff remains</text>
  <text x="42" y="62" class="subtitle">Vue starts larger but adds less code as the application grows.</text>
  <rect x="650" y="27" width="15" height="15" rx="2" fill="#238a62" />
  <text x="674" y="40" class="legend">Vue 3.5</text>
  <rect x="760" y="27" width="15" height="15" rx="2" fill="#d93600" />
  <text x="784" y="40" class="legend">Svelte 5</text>

  <text x="76" y="96" class="panel-title">One component’s generated code</text>
  <text x="76" y="117" class="panel-note">Framework runtime excluded</text>

    <line x1="76" y1="380" x2="426" y2="380" class="grid" />
    <text x="66" y="385" text-anchor="end" class="tick">0</text>
    <line x1="76" y1="301.33" x2="426" y2="301.33" class="grid" />
    <text x="66" y="306.33" text-anchor="end" class="tick">2 kB</text>
    <line x1="76" y1="222.67" x2="426" y2="222.67" class="grid" />
    <text x="66" y="227.67" text-anchor="end" class="tick">4 kB</text>
    <line x1="76" y1="144" x2="426" y2="144" class="grid" />
