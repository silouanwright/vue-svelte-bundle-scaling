<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" role="img" aria-labelledby="title description">
  <title id="title">TodoMVC in 2026: the bundle-size tradeoff remains</title>
  <desc id="description">Vue emits less component-specific code than Svelte in the current TodoMVC specimen. Svelte's complete one-component CSR and hydration bundles remain smaller because its shared framework baseline is smaller.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17202a; }
    .title { font-size: 23px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #4a5560; }
    .panel-title { font-size: 16px; font-weight: 700; }
    .axis { stroke: #44515e; stroke-width: 1.5; }
    .grid { stroke: #dce2e7; stroke-width: 1; }
    .tick { font-size: 12px; }
    .category { font-size: 13px; font-weight: 600; }
    .value { font-size: 11px; font-weight: 650; }
    .legend { font-size: 14px; font-weight: 650; }
  </style>
  <rect width="880" height="500" fill="#ffffff" />
  <text x="42" y="38" class="title">TodoMVC in 2026: the tradeoff remains</text>
  <text x="42" y="62" class="subtitle">Vue emits less component code; Svelte’s one-component app remains smaller.</text>
  <rect x="650" y="27" width="15" height="15" rx="2" fill="#238a62" />
  <text x="674" y="40" class="legend">Vue 3.5</text>
  <rect x="760" y="27" width="15" height="15" rx="2" fill="#d93600" />
  <text x="784" y="40" class="legend">Svelte 5</text>

  <text x="76" y="96" class="panel-title">Component-only output</text>

    <line x1="76" y1="380" x2="426" y2="380" class="grid" />
    <text x="66" y="385" text-anchor="end" class="tick">0</text>
    <line x1="76" y1="295.33" x2="426" y2="295.33" class="grid" />
    <text x="66" y="300.33" text-anchor="end" class="tick">2 kB</text>
    <line x1="76" y1="210.67" x2="426" y2="210.67" class="grid" />
    <text x="66" y="215.67" text-anchor="end" class="tick">4 kB</text>
    <line x1="76" y1="126" x2="426" y2="126" class="grid" />
    <text x="66" y="131" text-anchor="end" class="tick">6 kB</text>
  <line x1="76" y1="126" x2="76" y2="380" class="axis" />
  <line x1="76" y1="380" x2="426" y2="380" class="axis" />

    <rect x="101" y="219.05" width="30.333333333333336" height="160.95" rx="3" fill="#238a62" />
    <text x="116.16666666666667" y="211.05" text-anchor="middle" class="value">3.8 kB</text>
    <rect x="137.33333333333334" y="159.32" width="30.333333333333336" height="220.68" rx="3" fill="#d93600" />
    <text x="152.5" y="151.32" text-anchor="middle" class="value">5.2 kB</text>
    <text x="134.33333333333334" y="403" text-anchor="middle" class="category">Minified</text>
    <rect x="217.66666666666666" y="317.18" width="30.333333333333336" height="62.81999999999999" rx="3" fill="#238a62" />
    <text x="232.83333333333331" y="309.18" text-anchor="middle" class="value">1.48 kB</text>
    <rect x="254" y="305.41" width="30.333333333333336" height="74.58999999999997" rx="3" fill="#d93600" />
    <text x="269.1666666666667" y="297.41" text-anchor="middle" class="value">1.76 kB</text>
    <text x="251" y="403" text-anchor="middle" class="category">Gzip</text>
    <rect x="334.33333333333337" y="324.71" width="30.333333333333336" height="55.29000000000002" rx="3" fill="#238a62" />
    <text x="349.50000000000006" y="316.71" text-anchor="middle" class="value">1.31 kB</text>
    <rect x="370.6666666666667" y="316.5" width="30.333333333333336" height="63.5" rx="3" fill="#d93600" />
    <text x="385.83333333333337" y="308.5" text-anchor="middle" class="value">1.50 kB</text>
    <text x="367.6666666666667" y="403" text-anchor="middle" class="category">Brotli</text>

  <text x="520" y="96" class="panel-title">Complete bundle (Brotli)</text>

    <line x1="520" y1="380" x2="830" y2="380" class="grid" />
    <text x="510" y="385" text-anchor="end" class="tick">0</text>
    <line x1="520" y1="295.33" x2="830" y2="295.33" class="grid" />
    <text x="510" y="300.33" text-anchor="end" class="tick">10 kB</text>
    <line x1="520" y1="210.67" x2="830" y2="210.67" class="grid" />
    <text x="510" y="215.67" text-anchor="end" class="tick">20 kB</text>
    <line x1="520" y1="126" x2="830" y2="126" class="grid" />
    <text x="510" y="131" text-anchor="end" class="tick">30 kB</text>
  <line x1="520" y1="126" x2="520" y2="380" class="axis" />
  <line x1="520" y1="380" x2="830" y2="380" class="axis" />

    <rect x="560.5" y="181.5" width="34" height="198.5" rx="3" fill="#238a62" />
    <text x="577.5" y="173.5" text-anchor="middle" class="value">23.4 kB</text>
    <rect x="600.5" y="258.02" width="34" height="121.98000000000002" rx="3" fill="#d93600" />
    <text x="617.5" y="250.01999999999998" text-anchor="middle" class="value">14.4 kB</text>
    <text x="597.5" y="403" text-anchor="middle" class="category">CSR</text>
    <rect x="715.5" y="167.67" width="34" height="212.33" rx="3" fill="#238a62" />
    <text x="732.5" y="159.67" text-anchor="middle" class="value">25.1 kB</text>
    <rect x="755.5" y="256.5" width="34" height="123.5" rx="3" fill="#d93600" />
    <text x="772.5" y="248.5" text-anchor="middle" class="value">14.6 kB</text>
    <text x="752.5" y="403" text-anchor="middle" class="category">Hydration</text>
  <text x="440" y="478" text-anchor="middle" class="subtitle">Exact 2021 TodoMVC source specimen compiled with the pinned 2026 toolchain.</text>
</svg>
