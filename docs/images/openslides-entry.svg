<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" role="img" aria-labelledby="title description">
  <title id="title">OpenSlides Vue and Svelte production entry transfer</title>
  <desc id="description">The behavior-matched Vue port transfers less entry JavaScript and CSS than the pinned Svelte 5 application under both gzip and Brotli compression.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17202a; }
    .title { font-size: 23px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #4a5560; }
    .panel-title { font-size: 16px; font-weight: 700; }
    .panel-note { font-size: 12px; fill: #4a5560; }
    .axis { stroke: #44515e; stroke-width: 1.5; }
    .grid { stroke: #dce2e7; stroke-width: 1; }
    .tick { font-size: 12px; }
    .category { font-size: 13px; font-weight: 650; }
    .value { font-size: 12px; font-weight: 700; }
    .legend { font-size: 14px; font-weight: 650; }
  </style>
  <rect width="880" height="500" fill="#ffffff" />
  <text x="42" y="42" class="title">OpenSlides application entry transfer</text>
  <text x="42" y="66" class="subtitle">Medium-sized real application · Vue 3.5 and Svelte 5</text>
  <rect x="650" y="27" width="15" height="15" rx="2" fill="#238a62" />
  <text x="674" y="40" class="legend">Vue 3.5</text>
  <rect x="760" y="27" width="15" height="15" rx="2" fill="#d93600" />
  <text x="784" y="40" class="legend">Svelte 5</text>

  <text x="105" y="102" class="panel-title">Production entry JavaScript + CSS</text>
  <text x="105" y="123" class="panel-note">Same application behavior · each emitted response compressed independently</text>

    <line x1="105" y1="386" x2="795" y2="386" class="grid" />
    <text x="95" y="391" text-anchor="end" class="tick">0</text>
    <line x1="105" y1="327" x2="795" y2="327" class="grid" />
    <text x="95" y="332" text-anchor="end" class="tick">80 kB</text>
    <line x1="105" y1="268" x2="795" y2="268" class="grid" />
    <text x="95" y="273" text-anchor="end" class="tick">160 kB</text>
    <line x1="105" y1="209" x2="795" y2="209" class="grid" />
    <text x="95" y="214" text-anchor="end" class="tick">240 kB</text>
    <line x1="105" y1="150" x2="795" y2="150" class="grid" />
    <text x="95" y="155" text-anchor="end" class="tick">320 kB</text>
  <line x1="105" y1="150" x2="105" y2="386" class="axis" />
  <line x1="105" y1="386" x2="795" y2="386" class="axis" />

    <rect x="210.5" y="244.53" width="64" height="141.47" rx="3" fill="#238a62" />
    <text x="242.5" y="236.53" text-anchor="middle" class="value">191.8 kB</text>
    <rect x="280.5" y="161.96" width="64" height="224.04" rx="3" fill="#d93600" />
    <text x="312.5" y="153.96" text-anchor="middle" class="value">303.8 kB</text>
    <text x="277.5" y="409" text-anchor="middle" class="category">gzip</text>
    <rect x="555.5" y="266.06" width="64" height="119.94" rx="3" fill="#238a62" />
    <text x="587.5" y="258.06" text-anchor="middle" class="value">162.6 kB</text>
    <rect x="625.5" y="203.08" width="64" height="182.92" rx="3" fill="#d93600" />
    <text x="657.5" y="195.08" text-anchor="middle" class="value">248.0 kB</text>
    <text x="622.5" y="409" text-anchor="middle" class="category">Brotli</text>
</svg>
