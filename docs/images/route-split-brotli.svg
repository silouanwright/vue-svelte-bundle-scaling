    <text x="706" y="35" class="legend">Vue 3.5</text>
    <line x1="660" y1="55" x2="696" y2="55" stroke="#d93600" stroke-width="4" />
    <text x="706" y="60" class="legend">Svelte 5</text>

    <line x1="86" y1="430" x2="838" y2="430" class="grid" />
    <text x="72" y="435" text-anchor="end" class="tick">0 kB</text>
    <line x1="86" y1="358.4" x2="838" y2="358.4" class="grid" />
    <text x="72" y="363.4" text-anchor="end" class="tick">28 kB</text>
    <line x1="86" y1="286.8" x2="838" y2="286.8" class="grid" />
    <text x="72" y="291.8" text-anchor="end" class="tick">56 kB</text>
    <line x1="86" y1="215.2" x2="838" y2="215.2" class="grid" />
    <text x="72" y="220.2" text-anchor="end" class="tick">84 kB</text>
    <line x1="86" y1="143.6" x2="838" y2="143.6" class="grid" />
    <text x="72" y="148.6" text-anchor="end" class="tick">112 kB</text>
    <line x1="86" y1="72" x2="838" y2="72" class="grid" />
    <text x="72" y="77" text-anchor="end" class="tick">140 kB</text>
  <line x1="86" y1="72" x2="86" y2="430" class="axis" />
  <line x1="86" y1="430" x2="838" y2="430" class="axis" />

