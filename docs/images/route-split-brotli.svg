    <text x="180" y="457" text-anchor="middle" class="tick">64</text>
    <line x1="274" y1="430" x2="274" y2="437" class="axis" />
    <text x="274" y="457" text-anchor="middle" class="tick">128</text>
    <line x1="462" y1="430" x2="462" y2="437" class="axis" />
    <text x="462" y="457" text-anchor="middle" class="tick">256</text>
    <line x1="838" y1="430" x2="838" y2="437" class="axis" />
