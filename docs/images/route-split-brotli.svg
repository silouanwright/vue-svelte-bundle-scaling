<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" role="img" aria-labelledby="title description">
  <title id="title">Vue eventually becomes smaller than Svelte</title>
  <desc id="description">Total JavaScript transferred after visiting every route, with each response compressed independently using Brotli. The chart begins with the 64-definition sample: Svelte starts at 940 nonblank source lines and Vue starts at 1,159. Vue eventually transfers less JavaScript at the same source size.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17202a; }
    .title { font-size: 23px; font-weight: 700; }
    .axis { stroke: #44515e; stroke-width: 1.5; }
    .grid { stroke: #dce2e7; stroke-width: 1; }
    .tick { font-size: 13px; }
    .label { font-size: 15px; font-weight: 600; }
    .legend { font-size: 14px; font-weight: 650; }
    .marker { stroke: #687481; stroke-width: 1.5; stroke-dasharray: 7 6; }
    .annotation { font-size: 13px; font-weight: 650; fill: #4a5560; }
    .annotation-emphasis { font-size: 16px; font-weight: 725; }
    .callout-box { fill: #fff8e6; stroke: #d69e2e; stroke-width: 1.5; }
    .callout-icon { fill: #b7791f; }
    .callout-title { fill: #644b11; font-size: 13px; font-weight: 750; }
    .callout-text { fill: #644b11; font-size: 12px; }
  </style>
  <rect width="880" height="500" fill="#ffffff" />
  <text x="86" y="38" class="title">Vue eventually becomes smaller than Svelte</text>

    <line x1="660" y1="30" x2="696" y2="30" stroke="#238a62" stroke-width="4" />
    <text x="706" y="35" class="legend">Vue 3.5</text>
    <line x1="660" y1="55" x2="696" y2="55" stroke="#d93600" stroke-width="4" />
    <text x="706" y="60" class="legend">Svelte 5</text>

    <line x1="86" y1="430" x2="838" y2="430" class="grid" />
    <text x="72" y="435" text-anchor="end" class="tick">0 kB</text>
    <line x1="86" y1="358.4" x2="838" y2="358.4" class="grid" />
    <text x="72" y="363.4" text-anchor="end" class="tick">28 kB</text>
    <line x1="86" y1="286.8" x2="838" y2="286.8" class="grid" />
    <text x="72" y="291.8" text-anchor="end" class="tick">56 kB</text>
    <line x1="86" y1="215.2" x2="838" y2="215.2" class="grid" />
    <text x="72" y="220.2" text-anchor="end" class="tick">84 kB</text>
    <line x1="86" y1="143.6" x2="838" y2="143.6" class="grid" />
    <text x="72" y="148.6" text-anchor="end" class="tick">112 kB</text>
    <line x1="86" y1="72" x2="838" y2="72" class="grid" />
    <text x="72" y="77" text-anchor="end" class="tick">140 kB</text>
  <line x1="86" y1="72" x2="86" y2="430" class="axis" />
  <line x1="86" y1="430" x2="838" y2="430" class="axis" />

    <line x1="86" y1="430" x2="86" y2="437" class="axis" />
    <text x="86" y="457" text-anchor="middle" class="tick">0</text>
    <line x1="236.4" y1="430" x2="236.4" y2="437" class="axis" />
    <text x="236.4" y="457" text-anchor="middle" class="tick">2000</text>
    <line x1="386.8" y1="430" x2="386.8" y2="437" class="axis" />
    <text x="386.8" y="457" text-anchor="middle" class="tick">4000</text>
    <line x1="537.2" y1="430" x2="537.2" y2="437" class="axis" />
    <text x="537.2" y="457" text-anchor="middle" class="tick">6000</text>
    <line x1="687.6" y1="430" x2="687.6" y2="437" class="axis" />
    <text x="687.6" y="457" text-anchor="middle" class="tick">8000</text>
    <line x1="838" y1="430" x2="838" y2="437" class="axis" />
    <text x="838" y="457" text-anchor="middle" class="tick">10000</text>

    <line x1="245.39" y1="72" x2="245.39" y2="430" class="marker" />
    <text x="254.39" y="177" text-anchor="start" class="annotation annotation-emphasis">Crossover near 2.1k lines</text>
  <polyline points="173.16,339.92 258.58,309.95 429.44,250.11 771.15,130.44" fill="none" stroke="#238a62" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><circle cx="173.16" cy="339.92" r="5" fill="#238a62" /><circle cx="258.58" cy="309.95" r="5" fill="#238a62" /><circle cx="429.44" cy="250.11" r="5" fill="#238a62" /><circle cx="771.15" cy="130.44" r="5" fill="#238a62" /><polyline points="156.69,358.76 225.87,324.25 364.24,255.71 640.98,118.82" fill="none" stroke="#d93600" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><circle cx="156.69" cy="358.76" r="5" fill="#d93600" /><circle cx="225.87" cy="324.25" r="5" fill="#d93600" /><circle cx="364.24" cy="255.71" r="5" fill="#d93600" /><circle cx="640.98" cy="118.82" r="5" fill="#d93600" />

  <g transform="translate(450 292)">
    <rect width="367" height="94" rx="8" class="callout-box" />
    <g transform="translate(6 9) scale(0.1171875)" class="callout-icon">
      <path d="M236.8,188.09,149.35,36.22h0a24.76,24.76,0,0,0-42.7,0L19.2,188.09a23.51,23.51,0,0,0,0,23.72A24.35,24.35,0,0,0,40.55,224h174.9a24.35,24.35,0,0,0,21.33-12.19A23.51,23.51,0,0,0,236.8,188.09ZM120,104a8,8,0,0,1,16,0v40a8,8,0,0,1-16,0Zm8,88a12,12,0,1,1,12-12A12,12,0,0,1,128,192Z" />
    </g>
    <text x="40" y="25" class="callout-title">This is an estimate, not a rule!</text>
    <text x="40" y="47" class="callout-text">This demonstrates Vue’s amortization principle;</text><text x="40" y="64" class="callout-text">application structure, chunking, and compression vary.</text><text x="40" y="81" class="callout-text">The principle is proven; the exact threshold is not.</text>
  </g>
  <text x="462" y="480" text-anchor="middle" class="label">Nonblank source lines</text>
  <text x="22" y="251" text-anchor="middle" transform="rotate(-90 22 251)" class="label">JavaScript transferred after all routes (Brotli)</text>
</svg>
