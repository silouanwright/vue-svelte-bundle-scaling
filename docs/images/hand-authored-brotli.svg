<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" role="img" aria-labelledby="title description">
  <title id="title">Small 8-route application: Svelte remains smaller</title>
  <desc id="description">Total JavaScript transferred after visiting every route in the small product-shaped application. Svelte remains smaller through all 33 component definitions, while the gap narrows.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17202a; }
    .title { font-size: 23px; font-weight: 700; }
    .axis { stroke: #44515e; stroke-width: 1.5; }
    .grid { stroke: #dce2e7; stroke-width: 1; }
    .tick { font-size: 13px; }
    .label { font-size: 15px; font-weight: 600; }
    .legend { font-size: 14px; font-weight: 650; }
    .marker { stroke: #687481; stroke-width: 1.5; stroke-dasharray: 7 6; }
    .annotation { font-size: 13px; font-weight: 650; fill: #4a5560; }
    .annotation-emphasis { font-size: 16px; font-weight: 725; }
    .callout-box { fill: #fff8e6; stroke: #d69e2e; stroke-width: 1.5; }
    .callout-icon { fill: #b7791f; }
    .callout-title { fill: #644b11; font-size: 13px; font-weight: 750; }
    .callout-text { fill: #644b11; font-size: 12px; }
  </style>
  <rect width="880" height="500" fill="#ffffff" />
  <text x="86" y="38" class="title">Small 8-route application: Svelte remains smaller</text>

    <line x1="660" y1="30" x2="696" y2="30" stroke="#238a62" stroke-width="4" />
    <text x="706" y="35" class="legend">Vue 3.5</text>
    <line x1="660" y1="55" x2="696" y2="55" stroke="#d93600" stroke-width="4" />
    <text x="706" y="60" class="legend">Svelte 5</text>

    <line x1="86" y1="430" x2="838" y2="430" class="grid" />
    <text x="72" y="435" text-anchor="end" class="tick">0 kB</text>
    <line x1="86" y1="358.4" x2="838" y2="358.4" class="grid" />
    <text x="72" y="363.4" text-anchor="end" class="tick">8 kB</text>
    <line x1="86" y1="286.8" x2="838" y2="286.8" class="grid" />
    <text x="72" y="291.8" text-anchor="end" class="tick">16 kB</text>
    <line x1="86" y1="215.2" x2="838" y2="215.2" class="grid" />
    <text x="72" y="220.2" text-anchor="end" class="tick">24 kB</text>
    <line x1="86" y1="143.6" x2="838" y2="143.6" class="grid" />
    <text x="72" y="148.6" text-anchor="end" class="tick">32 kB</text>
    <line x1="86" y1="72" x2="838" y2="72" class="grid" />
    <text x="72" y="77" text-anchor="end" class="tick">40 kB</text>
  <line x1="86" y1="72" x2="86" y2="430" class="axis" />
  <line x1="86" y1="430" x2="838" y2="430" class="axis" />

    <line x1="199.94" y1="430" x2="199.94" y2="437" class="axis" />
    <text x="199.94" y="457" text-anchor="middle" class="tick">5</text>
    <line x1="291.09" y1="430" x2="291.09" y2="437" class="axis" />
    <text x="291.09" y="457" text-anchor="middle" class="tick">9</text>
    <line x1="473.39" y1="430" x2="473.39" y2="437" class="axis" />
    <text x="473.39" y="457" text-anchor="middle" class="tick">17</text>
    <line x1="838" y1="430" x2="838" y2="437" class="axis" />
    <text x="838" y="457" text-anchor="middle" class="tick">33</text>

  <polyline points="199.94,219.14 291.09,195.09 473.39,171.77 838,131.49" fill="none" stroke="#238a62" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><circle cx="199.94" cy="219.14" r="5" fill="#238a62" /><circle cx="291.09" cy="195.09" r="5" fill="#238a62" /><circle cx="473.39" cy="171.77" r="5" fill="#238a62" /><circle cx="838" cy="131.49" r="5" fill="#238a62" /><polyline points="199.94,304.77 291.09,276.87 473.39,244.63 838,199.55" fill="none" stroke="#d93600" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><circle cx="199.94" cy="304.77" r="5" fill="#d93600" /><circle cx="291.09" cy="276.87" r="5" fill="#d93600" /><circle cx="473.39" cy="244.63" r="5" fill="#d93600" /><circle cx="838" cy="199.55" r="5" fill="#d93600" />

  <text x="462" y="480" text-anchor="middle" class="label">Component definitions across lazy-loaded routes</text>
  <text x="22" y="251" text-anchor="middle" transform="rotate(-90 22 251)" class="label">JavaScript transferred after all routes (Brotli)</text>
