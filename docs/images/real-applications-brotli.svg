<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" role="img" aria-labelledby="title description">
  <title id="title">From a small app to a medium-sized app (kB)</title>
  <desc id="description">Svelte is smaller for the controlled Weather Front and independently authored terminal applications. Vue is smaller after the medium-sized OpenSlides dashboard route loads and extends its lead after the editor route loads. One continuous curve passes through the four measured Brotli transfer states for each framework.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17202a; }
    .title { font-size: 23px; font-weight: 700; }
    .subtitle { font-size: 13px; fill: #4a5560; }
    .axis { stroke: #44515e; stroke-width: 1.5; }
    .grid { stroke: #dce2e7; stroke-width: 1; }
    .tick { font-size: 12px; }
    .label { font-size: 14px; font-weight: 650; }
    .detail { font-size: 12px; fill: #4a5560; }
    .value { font-size: 12px; font-weight: 700; }
    .legend { font-size: 14px; font-weight: 650; }
    .crossover { font-size: 12px; font-weight: 700; fill: #4a5560; }
    .callout-box { fill: #fff8e6; stroke: #d69e2e; stroke-width: 1.5; }
    .callout-icon { fill: #b7791f; }
    .callout-title { fill: #644b11; font-size: 12px; font-weight: 750; }
    .callout-text { fill: #644b11; font-size: 11px; }
  </style>
  <rect width="880" height="500" fill="#ffffff" />
  <text x="42" y="50" class="title">From a small app to a medium-sized app (kB)</text>
  <text x="42" y="73" class="subtitle">Vue vs. Svelte · Actual "real-life" applications</text>
  <line x1="672" y1="30" x2="708" y2="30" stroke="#238a62" stroke-width="4" />
  <circle cx="690" cy="30" r="5" fill="#238a62" />
  <text x="718" y="35" class="legend">Vue</text>
  <line x1="770" y1="30" x2="806" y2="30" stroke="#d93600" stroke-width="4" />
  <rect x="783" y="25" width="10" height="10" rx="1" fill="#d93600" transform="rotate(45 788 30)" />
  <text x="816" y="35" class="legend">Svelte</text>
  <rect x="326" y="100" width="200" height="302" fill="#f2f5f7" />

  <line x1="92" y1="402" x2="830" y2="402" class="grid" />
  <text x="78" y="407" text-anchor="end" class="tick">0 kB</text>
  <line x1="92" y1="341.6" x2="830" y2="341.6" class="grid" />
  <text x="78" y="346.6" text-anchor="end" class="tick">100 kB</text>
  <line x1="92" y1="281.2" x2="830" y2="281.2" class="grid" />
  <text x="78" y="286.2" text-anchor="end" class="tick">200 kB</text>
  <line x1="92" y1="220.8" x2="830" y2="220.8" class="grid" />
  <text x="78" y="225.8" text-anchor="end" class="tick">300 kB</text>
  <line x1="92" y1="160.4" x2="830" y2="160.4" class="grid" />
  <text x="78" y="165.4" text-anchor="end" class="tick">400 kB</text>
  <line x1="92" y1="100" x2="830" y2="100" class="grid" />
  <text x="78" y="105" text-anchor="end" class="tick">500 kB</text>
  <line x1="92" y1="100" x2="92" y2="402" class="axis" />
  <line x1="92" y1="402" x2="830" y2="402" class="axis" />
  <line x1="340" y1="150" x2="512" y2="150" stroke="#7b8794" stroke-width="1.5" />
  <line x1="340" y1="144" x2="340" y2="156" stroke="#7b8794" stroke-width="1.5" />
  <line x1="512" y1="144" x2="512" y2="156" stroke="#7b8794" stroke-width="1.5" />
  <text x="426" y="119" text-anchor="middle" class="crossover">Possible crossover interval</text>
  <text x="426" y="137" text-anchor="middle" class="detail">Exact point varies by application</text>

  <path d="M 138 387.5 C 169.33 381.23, 261.33 378.66, 326 349.9 C 390.67 321.14, 455.67 245.44, 526 214.96 C 596.33 184.48, 711.00 174.99, 748 167" fill="none" stroke="#238a62" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="138" cy="387.5" r="6" fill="#238a62" /><circle cx="326" cy="349.9" r="6" fill="#238a62" /><circle cx="526" cy="214.96" r="6" fill="#238a62" /><circle cx="748" cy="167" r="6" fill="#238a62" />
  <path d="M 138 392.25 C 169.33 386.06, 261.33 390.76, 326 355.09 C 390.67 319.41, 455.67 214.63, 526 178.2 C 596.33 141.77, 711.00 143.45, 748 136.5" fill="none" stroke="#d93600" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="133" y="387.25" width="10" height="10" rx="1" fill="#d93600" transform="rotate(45 138 392.25)" /><rect x="321" y="350.09" width="10" height="10" rx="1" fill="#d93600" transform="rotate(45 326 355.09)" /><rect x="521" y="173.2" width="10" height="10" rx="1" fill="#d93600" transform="rotate(45 526 178.2)" /><rect x="743" y="131.5" width="10" height="10" rx="1" fill="#d93600" transform="rotate(45 748 136.5)" />
  <text x="138" y="373.5" text-anchor="middle" class="value">16–24 kB</text>
  <text x="326" y="335.9" text-anchor="middle" class="value">78–86 kB</text>
  <text x="516" y="166.2" text-anchor="end" class="value">370 kB</text>
  <text x="536" y="236.96" class="value">309 kB</text>
  <text x="738" y="124.5" text-anchor="end" class="value">439 kB</text>
  <text x="758" y="189" class="value">389 kB</text>
  <g transform="translate(510 282)">
    <rect width="310" height="106" rx="8" class="callout-box" />
    <g transform="translate(7 9) scale(0.09375)" class="callout-icon">
      <path d="M236.8,188.09,149.35,36.22h0a24.76,24.76,0,0,0-42.7,0L19.2,188.09a23.51,23.51,0,0,0,0,23.72A24.35,24.35,0,0,0,40.55,224h174.9a24.35,24.35,0,0,0,21.33-12.19A23.51,23.51,0,0,0,236.8,188.09ZM120,104a8,8,0,0,1,16,0v40a8,8,0,0,1-16,0Zm8,88a12,12,0,1,1,12-12A12,12,0,0,1,128,192Z" />
    </g>
    <text x="38" y="23" class="callout-title">This is an estimate, not a rule!</text>
    <text x="38" y="44" class="callout-text">This demonstrates Vue’s bundle-size crossover.</text>
    <text x="38" y="60" class="callout-text">Application structure, chunking, and</text>
    <text x="38" y="76" class="callout-text">compression vary. The principle is proven;</text>
    <text x="38" y="92" class="callout-text">the exact threshold is not.</text>
  </g>

  <text x="138" y="429" text-anchor="middle" class="label">Small app</text>
  <text x="138" y="449" text-anchor="middle" class="detail">Weather Front</text>
  <text x="138" y="467" text-anchor="middle" class="detail">Entire app</text>
  <text x="326" y="429" text-anchor="middle" class="label">Small app</text>
  <text x="326" y="449" text-anchor="middle" class="detail">Terminal</text>
  <text x="326" y="467" text-anchor="middle" class="detail">Entire app</text>
  <text x="526" y="429" text-anchor="middle" class="label">Medium-size app</text>
  <text x="526" y="449" text-anchor="middle" class="detail">OpenSlides · one route</text>
  <text x="526" y="467" text-anchor="middle" class="detail">Dashboard</text>
  <text x="748" y="429" text-anchor="middle" class="label">Medium-size app</text>
  <text x="748" y="449" text-anchor="middle" class="detail">OpenSlides · two routes</text>
  <text x="748" y="467" text-anchor="middle" class="detail">Dashboard + editor</text>
</svg>
