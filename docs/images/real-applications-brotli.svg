<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" role="img" aria-labelledby="title description">
  <title id="title">Measured transfer from Weather Front through route-split OpenSlides</title>
  <desc id="description">Svelte is slightly smaller for the separate Weather Front application. Vue is smaller after the OpenSlides dashboard route loads and extends its lead after the editor route loads. The dashed segment changes applications; the solid segment adds the second cumulative OpenSlides route.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17202a; }
    .title { font-size: 23px; font-weight: 700; }
    .subtitle { font-size: 13px; fill: #4a5560; }
    .axis { stroke: #44515e; stroke-width: 1.5; }
    .grid { stroke: #dce2e7; stroke-width: 1; }
    .tick { font-size: 12px; }
    .label { font-size: 14px; font-weight: 650; }
    .detail { font-size: 12px; fill: #4a5560; }
    .value { font-size: 12px; font-weight: 700; }
    .legend { font-size: 14px; font-weight: 650; }
  </style>
  <rect width="880" height="500" fill="#ffffff" />
  <text x="42" y="38" class="title">From a small app to route-split OpenSlides</text>
  <text x="42" y="61" class="subtitle">Cumulative Brotli transfer · measured production responses</text>
  <line x1="672" y1="30" x2="708" y2="30" stroke="#238a62" stroke-width="4" />
  <circle cx="690" cy="30" r="5" fill="#238a62" />
  <text x="718" y="35" class="legend">Vue</text>
  <line x1="770" y1="30" x2="806" y2="30" stroke="#d93600" stroke-width="4" />
  <rect x="783" y="25" width="10" height="10" rx="1" fill="#d93600" transform="rotate(45 788 30)" />
  <text x="816" y="35" class="legend">Svelte</text>

  <line x1="92" y1="408" x2="830" y2="408" class="grid" />
  <text x="78" y="413" text-anchor="end" class="tick">0 kB</text>
  <line x1="92" y1="362.29" x2="830" y2="362.29" class="grid" />
  <text x="78" y="367.29" text-anchor="end" class="tick">100 kB</text>
  <line x1="92" y1="316.57" x2="830" y2="316.57" class="grid" />
  <text x="78" y="321.57" text-anchor="end" class="tick">200 kB</text>
  <line x1="92" y1="270.86" x2="830" y2="270.86" class="grid" />
  <text x="78" y="275.86" text-anchor="end" class="tick">300 kB</text>
  <line x1="92" y1="225.14" x2="830" y2="225.14" class="grid" />
  <text x="78" y="230.14" text-anchor="end" class="tick">400 kB</text>
  <line x1="92" y1="179.43" x2="830" y2="179.43" class="grid" />
  <text x="78" y="184.43" text-anchor="end" class="tick">500 kB</text>
  <line x1="92" y1="133.71" x2="830" y2="133.71" class="grid" />
  <text x="78" y="138.71" text-anchor="end" class="tick">600 kB</text>
  <line x1="92" y1="88" x2="92" y2="408" class="axis" />
  <line x1="92" y1="408" x2="830" y2="408" class="axis" />

  <line x1="156" y1="393.64" x2="470" y2="266.43" stroke="#238a62" stroke-width="3" stroke-dasharray="7 7" stroke-linecap="round" />
  <line x1="470" y1="266.43" x2="752" y2="230.14" stroke="#238a62" stroke-width="4" stroke-linecap="round" />
  <circle cx="156" cy="393.64" r="6" fill="#238a62" /><circle cx="470" cy="266.43" r="6" fill="#238a62" /><circle cx="752" cy="230.14" r="6" fill="#238a62" />
  <line x1="156" y1="394.03" x2="470" y2="219.16" stroke="#d93600" stroke-width="3" stroke-dasharray="7 7" stroke-linecap="round" />
  <line x1="470" y1="219.16" x2="752" y2="107.74" stroke="#d93600" stroke-width="4" stroke-linecap="round" />
  <rect x="151" y="389.03" width="10" height="10" rx="1" fill="#d93600" transform="rotate(45 156 394.03)" /><rect x="465" y="214.16" width="10" height="10" rx="1" fill="#d93600" transform="rotate(45 470 219.16)" /><rect x="747" y="102.74" width="10" height="10" rx="1" fill="#d93600" transform="rotate(45 752 107.74)" />
  <text x="146" y="379.64" text-anchor="end" class="value">31.423</text>
  <text x="166" y="414.03" class="value">30.555</text>
  <text x="460" y="256.43" text-anchor="end" class="value">309.676</text>
  <text x="480" y="209.16" class="value">413.089</text>
  <text x="742" y="235.14" text-anchor="end" class="value">389.076</text>
  <text x="742" y="97.74" text-anchor="end" class="value">656.812</text>

  <text x="156" y="437" text-anchor="middle" class="label">Weather Front</text>
  <text x="156" y="456" text-anchor="middle" class="detail">separate small app</text>
  <text x="470" y="437" text-anchor="middle" class="label">OpenSlides dashboard</text>
  <text x="470" y="456" text-anchor="middle" class="detail">one route loaded</text>
  <text x="752" y="437" text-anchor="middle" class="label">OpenSlides editor</text>
  <text x="752" y="456" text-anchor="middle" class="detail">two routes loaded</text>
  <text x="440" y="482" text-anchor="middle" class="detail">Dashed: different application · solid: second OpenSlides route · values in kB</text>
</svg>
