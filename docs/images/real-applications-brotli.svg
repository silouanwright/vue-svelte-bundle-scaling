<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" role="img" aria-labelledby="title description">
  <title id="title">The bundle-size lead reverses between two measured real applications</title>
  <desc id="description">With Brotli compression, Svelte transfers 30.555 kilobytes and Vue transfers 31.423 kilobytes for the small Weather Front application. After loading the dashboard and editor in the route-split medium-sized OpenSlides application, Vue transfers 389.076 kilobytes and Svelte transfers 656.812 kilobytes. Lines connect the two measured applications and do not estimate a universal crossover threshold.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17202a; }
    .title { font-size: 23px; font-weight: 700; }
    .subtitle { font-size: 13px; fill: #4a5560; }
    .axis { stroke: #44515e; stroke-width: 1.5; }
    .grid { stroke: #dce2e7; stroke-width: 1; }
    .tick { font-size: 12px; }
    .label { font-size: 14px; font-weight: 650; }
    .detail { font-size: 12px; fill: #4a5560; }
    .value { font-size: 12px; font-weight: 700; }
    .legend { font-size: 14px; font-weight: 650; }
    .annotation { font-size: 13px; font-weight: 700; fill: #4a5560; }
  </style>
  <rect width="880" height="500" fill="#ffffff" />
  <text x="42" y="38" class="title">Two real applications, two different winners</text>
  <text x="42" y="61" class="subtitle">Brotli-compressed JavaScript + CSS · measured production output</text>
  <line x1="672" y1="30" x2="708" y2="30" stroke="#238a62" stroke-width="4" />
  <text x="718" y="35" class="legend">Vue</text>
  <line x1="770" y1="30" x2="806" y2="30" stroke="#d93600" stroke-width="4" />
  <text x="816" y="35" class="legend">Svelte</text>

  <line x1="104" y1="406" x2="822" y2="406" class="grid" />
  <text x="90" y="411" text-anchor="end" class="tick">0 kB</text>
  <line x1="104" y1="360.57" x2="822" y2="360.57" class="grid" />
  <text x="90" y="365.57" text-anchor="end" class="tick">100 kB</text>
  <line x1="104" y1="315.14" x2="822" y2="315.14" class="grid" />
  <text x="90" y="320.14" text-anchor="end" class="tick">200 kB</text>
  <line x1="104" y1="269.71" x2="822" y2="269.71" class="grid" />
  <text x="90" y="274.71" text-anchor="end" class="tick">300 kB</text>
  <line x1="104" y1="224.29" x2="822" y2="224.29" class="grid" />
  <text x="90" y="229.29" text-anchor="end" class="tick">400 kB</text>
  <line x1="104" y1="178.86" x2="822" y2="178.86" class="grid" />
  <text x="90" y="183.86" text-anchor="end" class="tick">500 kB</text>
  <line x1="104" y1="133.43" x2="822" y2="133.43" class="grid" />
  <text x="90" y="138.43" text-anchor="end" class="tick">600 kB</text>
  <line x1="104" y1="88" x2="104" y2="406" class="axis" />
  <line x1="104" y1="406" x2="822" y2="406" class="axis" />

  <line x1="224" y1="391.72" x2="700" y2="229.25" stroke="#238a62" stroke-width="4" stroke-linecap="round" />
  <circle cx="224" cy="391.72" r="6" fill="#238a62" />
  <circle cx="700" cy="229.25" r="6" fill="#238a62" />
  <line x1="224" y1="392.12" x2="700" y2="107.62" stroke="#d93600" stroke-width="4" stroke-linecap="round" />
  <circle cx="224" cy="392.12" r="6" fill="#d93600" />
  <circle cx="700" cy="107.62" r="6" fill="#d93600" />
  <text x="212" y="377.72" text-anchor="end" class="value">Vue 31.423 kB</text>
  <text x="236" y="414.12" class="value">Svelte 30.555 kB</text>
  <text x="688" y="234.25" text-anchor="end" class="value">Vue 389.076 kB</text>
  <text x="688" y="95.62" text-anchor="end" class="value">Svelte 656.812 kB</text>
  <text x="224" y="434" text-anchor="middle" class="label">Weather Front</text>
  <text x="224" y="453" text-anchor="middle" class="detail">small real application</text>
  <text x="700" y="434" text-anchor="middle" class="label">OpenSlides</text>
  <text x="700" y="453" text-anchor="middle" class="detail">dashboard → editor journey</text>
  <text x="440" y="482" text-anchor="middle" class="detail">Lines connect measured observations; they do not predict a universal threshold.</text>
</svg>
